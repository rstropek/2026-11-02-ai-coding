# QA for feature branches: runs on every push to a branch other than main.
# main has its own pipeline (main.yml) that also builds and deploys.
name: CI

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The version guard compares against origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Lint, typecheck, unit and component tests
        run: npm run check

      - name: Version is bumped above main
        run: npm run check:version

      # Same e2e run as on main, so a branch that breaks it never reaches main
      # and blocks the deployment there.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The architecture deck is maintained with the code, so it must keep building.
  deck:
    name: Architecture deck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/architecture
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/architecture/package-lock.json

      - run: npm ci

      - name: Build slides
        run: npm run build
