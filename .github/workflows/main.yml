# Pipeline for main: QA, publish the Docker image to GitHub Container Registry,
# deploy it to Azure App Service and verify that the new version is online.
# Runs one at a time so releases never overtake each other.
name: Main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rstropek/license-management
  RESOURCE_GROUP: rg-licensemanagement
  WEBAPP: app-licensemanager-rainer
  APP_URL: https://app-licensemanager-rainer.azurewebsites.net

jobs:
  qa:
    name: QA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Lint, typecheck, unit and component tests
        run: npm run check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  publish:
    name: Publish image
    needs: qa
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists. Bump the version with: npm version patch --no-git-tag-version"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ env.APP_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      # OIDC login with a user-assigned managed identity. Its federated
      # credential only trusts the `production` environment of this repo.
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Deploy the immutable version tag (not `latest`) so the running app
      # always maps to exactly one image. The image name must include the
      # registry host, otherwise App Service pulls from Docker Hub.
      - name: Point the web app to the new image
        run: |
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP" \
            --container-image-name "$IMAGE:$VERSION" \
            --output none

      - name: Wait until the new version is online
        run: |
          for attempt in $(seq 1 30); do
            online=$(curl --silent --fail --max-time 10 "$APP_URL/api/health" | jq -r .version || true)
            echo "Attempt $attempt: online version '${online}', expected '$VERSION'"
            if [ "$online" = "$VERSION" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Version $VERSION is not online after 5 minutes"
          exit 1
